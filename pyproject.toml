[project]
name = "tfm-airquality"
version = "0.1.0"
description = "Predicción de NO2 a 24-48 horas a partir de sensores de bajo coste"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.4",
    "seaborn>=0.12",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfm_airquality"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"